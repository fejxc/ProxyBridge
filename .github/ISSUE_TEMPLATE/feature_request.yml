name: 功能建议
description: 新能力、协议支持、体验改进的想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述你遇到的场景与困难，而不是直接给方案——问题本身往往比方案更有信息量
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你期望的行为或界面
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代做法
      description: 目前你如何绕过这个限制（终端命令、其他工具等）
