name: CI

on:
  push:
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build & Test (macOS 15, target 14)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 工具链信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # 每个验证步骤都把完整输出落到日志文件；失败时由「报告错误」步骤
      # 把首个 error 行转成 ::error:: annotation（公开仓库可匿名读取）
      - name: 构建系统清单一致性（pbxproj ↔ swiftc 脚本）
        run: |
          set -o pipefail
          bash scripts/check_build_sync.sh 2>&1 | tee build-ci-sync.log

      - name: 编译检查
        run: |
          set -o pipefail
          bash scripts/typecheck.sh 2>&1 | tee build-ci-typecheck.log | tail -3

      - name: 冒烟测试
        run: |
          set -o pipefail
          bash scripts/smoke_test.sh 2>&1 | tee build-ci-smoke.log | tail -3

      - name: 本地 TCP Relay 精度与生命周期验证
        run: |
          set -o pipefail
          bash scripts/relay_test.sh 2>&1 | tee build-ci-relay.log | tail -5

      - name: xcodebuild build（Debug）
        run: |
          set -o pipefail
          xcodebuild -project ProxyBridge.xcodeproj -scheme ProxyBridge \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build-ci-xcodebuild-build.log | tail -5

      - name: xcodebuild test（XCTest 全量）
        run: |
          set -o pipefail
          xcodebuild -project ProxyBridge.xcodeproj -scheme ProxyBridge \
            -configuration Debug CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee build-ci-xcodebuild-test.log | tail -8

      - name: 构建可分发的 .app
        run: bash scripts/build_app.sh

      - name: 报告错误（失败日志 → annotation）
        if: failure()
        run: |
          for f in build-ci-sync.log build-ci-typecheck.log build-ci-smoke.log build-ci-relay.log build-ci-xcodebuild-build.log build-ci-xcodebuild-test.log; do
            [ -f "$f" ] || continue
            grep -E "error:|FAIL |failing" "$f" | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::$f :: ${line:0:300}"
            done
          done
          exit 1

      - name: 上传检查日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-logs
          path: build-ci-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 保留 App 包结构及可执行权限
        if: success()
        run: ditto -c -k --sequesterRsrc --keepParent build/ProxyBridge.app build/ProxyBridge.app.zip

      - name: 上传 App 产物
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ProxyBridge-app
          path: build/ProxyBridge.app.zip
          retention-days: 14
